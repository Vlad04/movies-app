<!-- Archivo para la estructura general: barra lateral y área principal -->
<div class="app-shell">
  <!-- Barra lateral de navegación -->
  <aside class="sidebar">
    <a class="brand" routerLink="/movies" aria-label="Ir a películas">


      <span>
        <strong>Movies Manager</strong>
        <small>Evaluación técnica</small>
      </span>
    </a>

    <!-- Navegación entre las secciones principales -->
    <p class="nav-label">Administración</p>

    <nav aria-label="Navegación principal">
      <!-- Refresca la información sin recargar la página -->
      <a routerLink="/movies" routerLinkActive="active">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 6.5h16v11H4zM8 6.5V4m8 2.5V4M4 10h16" />
        </svg>
        <span>Películas</span>
      </a>
      <a routerLink="/directors" routerLinkActive="active">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="8" r="3.5" />
          <path d="M5.5 19c.8-3.5 3-5.2 6.5-5.2s5.7 1.7 6.5 5.2" />
        </svg>
        <span>Directores</span>
      </a>
    </nav>
  </aside>

  <!-- Área donde se presenta el contenido de la ruta seleccionada -->
  <section class="workspace">
    <header class="topbar">
      <div>
        <strong>Catálogo cinematográfico</strong>
      </div>

      <div class="stack-badge">
        <span class="status-dot"></span>
        Conectado
      </div>
    </header>

    <!--
      Angular reemplaza router-outlet por el componente correspondiente:
      Movies para /movies o Directors para /directors.
    -->
    <main>
      <router-outlet></router-outlet>
    </main>
  </section>
</div>
